services:
  - type: web
    name: healthcheck-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/predict/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:5000
      - key: MODEL_PORT
        value: "5000"
      - key: MONGO_URI
        sync: false

